# Perfil "mariadb": la base de datos vive en un contenedor y los datos sobreviven al apagar la aplicacion.
# Se activa con --spring.profiles.active=mariadb (o con SPRING_PROFILES_ACTIVE=mariadb).
# Lo que no se define aqui (JPA, Swagger, JWT...) se hereda de application.properties.

# --- Base de datos MariaDB ---
# Contenedor local: puerto 3307 del equipo -> 3306 del contenedor (ver docker-compose.yml).
# Dentro de docker-compose la URL se sobrescribe con SPRING_DATASOURCE_URL.
spring.datasource.url=jdbc:mariadb://localhost:3307/ecommercedb
spring.datasource.username=root
spring.datasource.password=root

# update: crea lo que falte pero NO borra al apagar
spring.jpa.hibernate.ddl-auto=update

# Datos de ejemplo (los mismos data-*.sql de H2: usuarios, finca, lotes, presentaciones con fotos y compras).
# always: se cargan al arrancar; never: la base empieza vacia (se define con la variable DATOS_DE_EJEMPLO).
# Como la base ya existe al reiniciar, los INSERT repetidos fallan por clave duplicada: continue-on-error los
# omite y se conserva lo que haya en la base (usuarios nuevos, compras, etc.).
spring.sql.init.mode=${DATOS_DE_EJEMPLO:always}
spring.sql.init.continue-on-error=true

# La consola H2 no aplica aqui
spring.h2.console.enabled=false
