<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm">
        <div class="card-header text-center py-3">
          <h5 class="mb-0">
            <i class="fa-solid fa-right-to-bracket me-2"></i>Iniciar sesión
          </h5>
        </div>
        <div class="card-body">
          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label for="email" class="form-label">Correo electrónico</label>
              <input
                id="email"
                type="email"
                formControlName="email"
                class="form-control"
                placeholder="correo@ejemplo.com"
              />
              @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
                <div class="text-danger small mt-1">Ingresa un correo electrónico válido.</div>
              }
            </div>

            <div class="mb-3">
              <label for="contrasena" class="form-label">Contraseña</label>
              <input
                id="contrasena"
                type="password"
                formControlName="contrasena"
                class="form-control"
                placeholder="••••••••"
              />
              @if (loginForm.get('contrasena')?.invalid && loginForm.get('contrasena')?.touched) {
                <!-- touched: el usuario ya pasó por este campo -->
                <div class="text-danger small mt-1">Ingresa tu contraseña.</div>
              }
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-primary" [disabled]="!canSubmit()">
                @if (isLoading()) {
                  <span class="spinner-border spinner-border-sm me-2"></span>Ingresando...
                } @else {
                  <i class="fa-solid fa-right-to-bracket me-2"></i>Ingresar
                }
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
