<nav class="navbar navbar-expand-md barra-cafe">
  <div class="container">
    <a routerLink="/" class="navbar-brand d-flex align-items-center gap-2">
      <span class="logo-cafe"><i class="fa-solid fa-mug-hot"></i></span>
      <span>Café de Origen</span>
    </a>

    <!-- Botón de hamburguesa: solo se ve en el celular -->
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navMenu"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="nav-link"
          >
            <i class="fa-solid fa-house me-1"></i>Inicio
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/catalogo" routerLinkActive="active" class="nav-link">
            <i class="fa-solid fa-store me-1"></i>Catálogo
          </a>
        </li>
        @if (esComprador()) {
          <li class="nav-item">
            <a routerLink="/mis-compras" routerLinkActive="active" class="nav-link">
              <i class="fa-solid fa-bag-shopping me-1"></i>Mis compras
            </a>
          </li>
        }
        @if (esVendedor()) {
          <li class="nav-item">
            <a routerLink="/descuentos" routerLinkActive="active" class="nav-link">
              <i class="fa-solid fa-percent me-1"></i>Mis descuentos
            </a>
          </li>
          <li class="nav-item">
            <a routerLink="/mis-fotos" routerLinkActive="active" class="nav-link">
              <i class="fa-solid fa-images me-1"></i>Mis fotos
            </a>
          </li>
        }
        @if (!isLoggedIn()) {
          <li class="nav-item">
            <a routerLink="/registro" routerLinkActive="active" class="nav-link">
              <i class="fa-solid fa-user-plus me-1"></i>Registro
            </a>
          </li>
        }
      </ul>

      <div class="d-flex align-items-center gap-2">
        <button
          type="button"
          class="btn btn-sm boton-barra"
          [attr.aria-label]="tema.oscuro() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
          (click)="tema.alternar()"
        >
          <i class="fa-solid" [class.fa-moon]="!tema.oscuro()" [class.fa-sun]="tema.oscuro()"></i>
        </button>
        @if (isLoggedIn()) {
          <span class="navbar-text">Hola, {{ nombreUsuario() }}</span>
          <button class="btn btn-sm boton-barra" (click)="cerrarSesion()">
            <i class="fa-solid fa-right-from-bracket me-1"></i>Cerrar sesión
          </button>
        } @else {
          <a routerLink="/login" class="btn btn-sm btn-primary">
            <i class="fa-solid fa-right-to-bracket me-1"></i>Ingresar
          </a>
        }
      </div>
    </div>
  </div>
</nav>
