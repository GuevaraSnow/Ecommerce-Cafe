# MariaDB + la aplicacion. Antes: ./gradlew bootJar
# Levantar:  docker compose up --build -d
# Apagar:    docker compose down      (los datos quedan en el volumen)
# Borrar todo, datos incluidos: docker compose down -v
#
# Las claves de Groq y Cloudinary NO van aqui: se toman de las variables de entorno del equipo
# o de un archivo .env junto a este (ver .env.example). Sin ellas todo funciona, menos el chat y las fotos.
services:
  mariadb:
    image: mariadb:11
    container_name: mariadb-ecommerce
    # utf8mb4 para que las tildes y la ñ se guarden bien
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: ecommercedb
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: ecommerce-app
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mariadb
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/ecommercedb
      JWT_SECRET: ${JWT_SECRET:-cafe-trazado-clave-de-desarrollo-no-usar-en-produccion}
      # always: carga los usuarios y productos de ejemplo la primera vez; never: empieza con la base vacia
      DATOS_DE_EJEMPLO: ${DATOS_DE_EJEMPLO:-always}
      # Asesor con IA (Groq) y fotos (Cloudinary): opcionales
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  mariadb-data:
