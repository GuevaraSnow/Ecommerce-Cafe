# MariaDB + la aplicacion. Antes: ./gradlew bootJar
# Levantar:  docker compose up --build -d
# Apagar:    docker compose down      (los datos quedan en el volumen)
# Borrar todo, datos incluidos: docker compose down -v
services:
  mariadb:
    image: mariadb:11
    container_name: mariadb-ecommerce
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: ecommercedb
    ports:
      - "3307:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: ecommerce-app
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mariadb
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/ecommercedb
      JWT_SECRET: ${JWT_SECRET:-cafe-trazado-clave-de-desarrollo-no-usar-en-produccion}
    ports:
      - "8080:8080"

volumes:
  mariadb-data:
