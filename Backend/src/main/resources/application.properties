spring.application.name=ecommerce

# --- Swagger UI (SpringDoc) ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# --- Base de datos H2 (en memoria) ---
spring.datasource.url=jdbc:h2:mem:ecommercedb
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# --- Datos de prueba: un archivo por agregado (los que no existan todavia se omiten) ---
spring.sql.init.data-locations=optional:classpath:data-presentacion.sql,optional:classpath:data-compra.sql,optional:classpath:data-usuarios.sql

# --- Consola web de H2 ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT: clave de firma (HS256, minimo 32 caracteres) y duracion del token. En produccion se define con la variable JWT_SECRET.
app.jwt.secret=${JWT_SECRET:cafe-trazado-clave-de-desarrollo-no-usar-en-produccion}
app.jwt.duracion-minutos=60
