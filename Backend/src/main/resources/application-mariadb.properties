# Perfil "mariadb": la base de datos vive en un contenedor y los datos sobreviven al apagar la aplicacion.
# Se activa con --spring.profiles.active=mariadb (o con SPRING_PROFILES_ACTIVE=mariadb).
# Lo que no se define aqui (JPA, Swagger, JWT...) se hereda de application.properties.

# --- Base de datos MariaDB ---
# Contenedor local: puerto 3307 del equipo -> 3306 del contenedor (ver docker-compose.yml).
# Dentro de docker-compose la URL se sobrescribe con SPRING_DATASOURCE_URL.
spring.datasource.url=jdbc:mariadb://localhost:3307/ecommercedb
spring.datasource.username=root
spring.datasource.password=root

# update: crea lo que falte pero NO borra al apagar
spring.jpa.hibernate.ddl-auto=update

# Los data-*.sql son para H2; en MariaDB se empieza con las tablas vacias
spring.sql.init.mode=never

# La consola H2 no aplica aqui
spring.h2.console.enabled=false
